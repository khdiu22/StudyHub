{% extends "base.html" %}
{% block title %}Preferences - StudyHub{% endblock %}
{% block content %}
    <section class="page">
        <h1>Preferences</h1>
        <p>Current theme: <strong>{{ theme|capfirst }}</strong></p>
        <form method="post" class="theme-form">
            {% csrf_token %}
            <label><input type="radio" name="theme" value="light" {% if theme == 'light' %}checked{% endif %}> Light</label>
            <label><input type="radio" name="theme" value="dark" {% if theme == 'dark' %}checked{% endif %}> Dark</label>
            <button type="submit" class="btn">Save Preference</button>
        </form>
    </section>
{% endblock %}
