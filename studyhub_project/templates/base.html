{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyHub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% if theme == 'dark' %}
        <link rel="stylesheet" href="{% static 'css/dark.css' %}">
    {% else %}
        <link rel="stylesheet" href="{% static 'css/light.css' %}">
    {% endif %}
</head>
<body class="theme-{{ theme }}">

    <header class="site-header">
        <div class="header-inner">
            <a href="{% url 'core:home' %}" class="brand">
                <img src="{% static 'images/logo.png' %}" alt="StudyHub logo" class="logo">
                <span>StudyHub</span>
            </a>
            <nav class="main-nav">
                <a href="{% url 'core:home' %}">Home</a>
                <a href="{% url 'core:resource_list' %}">Resources</a>
                <a href="{% url 'core:favorites' %}">Favorites</a>
                <a href="{% url 'core:preferences' %}">Preferences</a>
                <a href="{% url 'core:feedback' %}">Feedback</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 StudyHub. All rights reserved.</p>
    </footer>

</body>
</html>
